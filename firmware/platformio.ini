; 三个环境：
;   sim      电脑上的 SDL 模拟器（pio run -e sim，然后运行 .pio/build/sim/program）
;   test     单元测试（pio test -e test）
;   xiao     XIAO ESP32S3 真机固件；Wokwi 仿真也跑这一份
; 素材（字库、图标、网页）在 data/，由 tools/build_assets.py 生成；真机用 pio run -e xiao -t uploadfs 写入。

[platformio]
default_envs = sim

[common]
build_flags = -std=gnu++17 -Wall -Wno-unused-function
build_unflags = -std=gnu++11
core_deps = bblanchon/ArduinoJson@^7.2.0

[env:sim]
platform = native
build_src_filter = +<sim/>
build_flags =
  ${common.build_flags}
  -g -O1 -pthread
  !sdl2-config --cflags --libs
build_unflags = ${common.build_unflags}
lib_deps = ${common.core_deps}

[env:test]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = ${common.build_flags} -g
build_unflags = ${common.build_unflags}
lib_deps = ${common.core_deps}

[env:xiao]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = +<esp32/>
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = ${common.build_unflags}
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  ${common.core_deps}
  zinggjm/GxEPD2@1.6.9

; Wokwi 仿真用：和真机同一份代码，只是没配 WiFi 时连 Wokwi 的虚拟热点 Wokwi-GUEST
; 构建：wokwi/build.sh
[env:wokwi]
extends = env:xiao
build_flags =
  ${env:xiao.build_flags}
  -DWOKWI_SIM
